<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Clareira · Aviso dentro do jogo</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
/* fundo de demonstração: o jogo fica por trás; aqui é só um cinza escuro para mostrar o aviso */
body{overflow:hidden;font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:#0d1117;color:#f3e7cf}
.game-demo{position:fixed;inset:0;background:linear-gradient(180deg,#131a24,#0a0e14)}
.aviso{position:fixed;inset:0;display:grid;place-items:center;background:rgba(4,8,14,.55);transition:opacity .5s ease}
.aviso.hide{opacity:0;pointer-events:none}
/* moldura e papiro: mesma geometria da tela de fora do jogo */
.box{position:relative;width:min(88vw,calc(130vh));aspect-ratio:3/2}
.box img{position:absolute;display:block;pointer-events:none;user-select:none}
/* mesma geometria do palco da tela de fora: moldura em 15%/16,4% com 70%; papiro dentro da abertura */
.box .moldura{left:15%;top:16.4%;width:70%;height:70%;z-index:2}
.box .papiro{left:29.14%;top:31.3%;width:41.65%;height:44.38%;object-fit:fill;z-index:1}
/* espaço reservado para o símbolo do aviso (presente, staff, denúncia...). Vazio por enquanto. */
.slot{position:absolute;left:50%;top:25.3%;width:6.6%;aspect-ratio:1/1;transform:translate(-50%,-50%);border-radius:50%;border:2px dashed #8a5a2a99;background:rgba(243,225,182,.18);z-index:4;background-size:70% 70%;background-position:center;background-repeat:no-repeat}
/* texto dentro do papiro */
/* área segura: dentro das quatro molduras de canto do papiro, com margem */
.conteudo{position:absolute;left:34%;top:38%;width:32%;height:30%;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.faixa{margin:0;padding:3px 12px;border-radius:999px;font-size:clamp(9px,.9vw,12px);letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:#fff;text-shadow:0 1px 1px #0008}
.faixa.presente{background:#b8862a}
.faixa.aviso{background:#2f5f8a}
.faixa.denuncia{background:#8a2e2e}
h1{margin:8px 0 0;font-family:Georgia,'Palatino Linotype',serif;font-size:clamp(16px,2.1vw,28px);line-height:1.1;color:#4a2a10;text-shadow:0 1px 0 #f5e2b0}
.texto{margin:6px 0 0;max-width:34ch;font-size:clamp(11px,1.05vw,15px);line-height:1.5;color:#3f2c17;text-wrap:balance}
.de{margin:6px 0 0;font-size:clamp(10px,.9vw,12px);color:#6f5530;font-style:italic}
.botao{margin-top:12px;padding:7px 18px;border-radius:6px;border:2px solid #8a5a2a;background:#f3e1b6;color:#4a2a10;font-weight:700;font-size:clamp(11px,1vw,13px);cursor:pointer}
.botao:hover{background:#fbeccb}
/* X para fechar, no canto do papiro */
.fechar{position:absolute;left:66.6%;top:31.8%;width:clamp(24px,2.6vw,34px);height:clamp(24px,2.6vw,34px);border-radius:50%;border:2px solid #8a5a2a;background:#f3e1b6;color:#4a2a10;font-size:clamp(14px,1.4vw,18px);line-height:1;font-weight:800;cursor:pointer;display:grid;place-items:center;z-index:5;box-shadow:0 2px 6px #0006}
.fechar:hover{background:#fbeccb}
@media (orientation:portrait){
  .box{width:min(94vw,440px);aspect-ratio:1348/946}
  .box .moldura{display:none}
  .slot{display:none}
  .box .papiro{left:0;top:0;width:100%;height:100%}
  .conteudo{left:19%;top:22%;width:62%;height:56%}
  .fechar{left:86%;top:8%}
  h1{font-size:clamp(15px,4.6vw,19px)}
  .texto{font-size:clamp(10.5px,3vw,12px)}
}
</style>
</head>
<body>
<div class="game-demo" aria-hidden="true"></div>

<div class="aviso" id="aviso" role="dialog" aria-modal="true" aria-labelledby="tit">
  <div class="box">
    <img class="papiro" src="assets/paper.png" alt="">
    <img class="moldura" src="assets/frame.png" alt="">
    <div class="slot" id="slot" aria-hidden="true"></div>
    <button class="fechar" id="fechar" aria-label="Fechar aviso">×</button>
    <div class="conteudo" id="conteudo"></div>
  </div>
</div>

<script>
/* =========================================================
   CONTEÚDO DO AVISO — o staff preenche só este trecho.
   tipo: "presente" (dourado), "aviso" (azul), "denuncia" (vermelho)
   ========================================================= */
var AVISO = {
  tipo: "presente",
  faixa: "Presente recebido",
  titulo: "Você recebeu um presente",
  texto: "Um presente da equipe chegou para você. Ele já está no seu inventário.",
  de: "Enviado pela staff",
  botao: "Entendi",
  simbolo: ""   // caminho da imagem do símbolo; vazio = espaço reservado sem símbolo
};

(function () {
  var box = document.getElementById("conteudo");
  var aviso = document.getElementById("aviso");
  var slot = document.getElementById("slot");
  if (slot) { slot.dataset.tipo = AVISO.tipo; if (AVISO.simbolo) slot.style.backgroundImage = 'url("' + AVISO.simbolo + '")'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  box.innerHTML =
    '<p class="faixa ' + esc(AVISO.tipo) + '">' + esc(AVISO.faixa) + '</p>' +
    '<h1 id="tit">' + esc(AVISO.titulo) + '</h1>' +
    '<p class="texto">' + esc(AVISO.texto) + '</p>' +
    (AVISO.de ? '<p class="de">' + esc(AVISO.de) + '</p>' : '') +
    '<button class="botao" id="ok">' + esc(AVISO.botao) + '</button>';
  function fechar() { aviso.classList.add("hide"); }
  document.getElementById("fechar").onclick = fechar;
  document.getElementById("ok").onclick = fechar;
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") fechar(); });
})();
</script>
</body>
</html>
